name: Docker CI/CD

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t gp-accessibility-pipeline .

      - name: Smoke test - Airflow can initialize
        run: docker run --rm gp-accessibility-pipeline airflow db check

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: docker build -t ghcr.io/jims01/gp_accessibility_airflow:latest .

      - name: Push the image
        run: docker push ghcr.io/jims01/gp_accessibility_airflow:latest
